<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Board Aggregator - Phase 1 Live</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 500: '#6366f1', 600: '#4f46e5' } } } } }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-30 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="bg-brand-600 text-white p-2 rounded-lg"><i class="fa-solid fa-satellite-dish text-xl"></i></div>
      <div>
        <h1 class="text-lg font-bold">AutoApply Agent <span class="text-xs font-normal text-brand-500 border border-brand-500/40 px-2 py-0.5 rounded-full ml-2">Static Cloud Mirror</span></h1>
        <p class="text-xs text-slate-400">Decentralized ATS Ingestion Feed (Updated via GitHub Actions Cron)</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="loadAndFilterJobs()" class="bg-brand-600 hover:bg-brand-500 text-sm font-semibold px-4 py-2 rounded-lg flex items-center gap-2 transition shadow-lg shadow-brand-600/30">
        <i class="fa-solid fa-filter"></i> Apply Filters
      </button>
    </div>
  </header>

  <main class="flex-1 p-6 max-w-[1400px] w-full mx-auto space-y-6">

    <!-- Filters Panel -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-xl space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <div class="flex items-center gap-2 text-xs">
          <span class="text-slate-400">Data Pool:</span>
          <strong id="cache-total" class="text-emerald-400">Loading...</strong>
          <span class="text-slate-600">|</span>
          <span class="text-slate-400">Last Synced:</span>
          <span id="cache-synced" class="text-slate-300 font-mono text-[11px]">-</span>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
        <div>
          <label class="block text-slate-300 font-semibold mb-1">Target Roles / Keywords (comma-separated)</label>
          <input id="cfg-roles" type="text" placeholder="e.g. Software, Backend, Python, Developer" class="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-slate-200 focus:outline-none focus:border-brand-500">
        </div>
        <div>
          <label class="block text-slate-300 font-semibold mb-1">Locations (comma-separated)</label>
          <input id="cfg-locations" type="text" placeholder="e.g. India, Remote, San Francisco" class="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-slate-200 focus:outline-none focus:border-brand-500">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
        <div>
          <label class="block text-slate-300 font-semibold mb-1">Excluded Keywords (comma-separated)</label>
          <input id="cfg-excluded" type="text" placeholder="e.g. Staff, Principal, Director, Intern" class="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-slate-200 focus:outline-none focus:border-brand-500">
        </div>
        <div>
          <label class="block text-slate-300 font-semibold mb-1">Max Age in Days (Empty = Any)</label>
          <input id="cfg-age" type="number" placeholder="e.g. 30" class="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-slate-200 focus:outline-none focus:border-brand-500">
        </div>
      </div>
    </div>

    <!-- Results Table -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
      <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center">
        <h2 class="font-bold text-sm flex items-center gap-2">
          <i class="fa-solid fa-list-check text-slate-400"></i> Discovered Job Postings (<span id="results-count" class="text-brand-500">0</span>)
        </h2>
      </div>
      <div class="overflow-x-auto max-h-[600px] overflow-y-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-950/80 text-slate-400 text-xs uppercase border-b border-slate-800 sticky top-0 backdrop-blur">
            <tr>
              <th class="px-6 py-3">Role & Company</th>
              <th class="px-4 py-3">ATS Platform</th>
              <th class="px-4 py-3">Location</th>
              <th class="px-4 py-3">Posted Date</th>
              <th class="px-6 py-3 text-right">Apply Link</th>
            </tr>
          </thead>
          <tbody id="job-table-body" class="divide-y divide-slate-800/60 text-xs">
            <tr><td colspan="5" class="text-center py-8 text-slate-500">Click "Apply Filters" or wait for cache to load...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    let ALL_CHUNKS_JOBS = [];

    async function initFeed() {
      try {
        const manifestRes = await fetch('./data/cache/manifest.json');
        if (!manifestRes.ok) throw new Error("Manifest not found. Wait for the first GitHub Action run.");
        const manifest = await manifestRes.json();

        document.getElementById('cache-total').innerText = `${manifest.total_jobs || 0} jobs (${manifest.total_chunks || 0} chunks)`;
        document.getElementById('cache-synced').innerText = manifest.last_updated ? manifest.last_updated.replace('T', ' ').substring(0, 19) + ' UTC' : 'N/A';

        // Load chunks in parallel using pako to decompress gzip
        const chunks = manifest.chunks || [];
        const fetchPromises = chunks.map(async (c) => {
          const res = await fetch(`./data/cache/${c}`);
          const arrayBuffer = await res.arrayBuffer();
          const uncompressed = pako.ungzip(new Uint8Array(arrayBuffer), { to: 'string' });
          return JSON.parse(uncompressed);
        });

        const chunkArrays = await Promise.all(fetchPromises);
        ALL_CHUNKS_JOBS = chunkArrays.flat();
        loadAndFilterJobs();
      } catch (err) {
        document.getElementById('job-table-body').innerHTML = `<tr><td colspan="5" class="text-center py-8 text-amber-400 font-mono text-xs">Waiting for GitHub Actions to complete the first scrape run. Trigger it under your repository's "Actions" tab.</td></tr>`;
      }
    }

    function loadAndFilterJobs() {
      const roles = document.getElementById('cfg-roles').value.toLowerCase().split(',').map(s => s.trim()).filter(Boolean);
      const locs = document.getElementById('cfg-locations').value.toLowerCase().split(',').map(s => s.trim()).filter(Boolean);
      const excls = document.getElementById('cfg-excluded').value.toLowerCase().split(',').map(s => s.trim()).filter(Boolean);
      const maxAge = parseInt(document.getElementById('cfg-age').value) || null;

      const filtered = ALL_CHUNKS_JOBS.filter(job => {
        const title = (job.title || '').toLowerCase();
        const loc = (job.location || '').toLowerCase();

        if (excls.some(ex => title.includes(ex))) return false;
        if (roles.length > 0 && !roles.some(r => title.includes(r))) return false;
        if (locs.length > 0 && !locs.some(l => loc.includes(l))) return false;

        return true;
      });

      document.getElementById('results-count').innerText = filtered.length;
      const tbody = document.getElementById('job-table-body');
      tbody.innerHTML = '';

      filtered.slice(0, 300).forEach(job => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-800/40 transition";
        tr.innerHTML = `
          <td class="px-6 py-3"><div class="font-semibold text-white">${job.title}</div><div class="text-xs text-slate-400">${job.company}</div></td>
          <td class="px-4 py-3 uppercase text-[10px] font-mono font-bold text-slate-400">${job.ats_provider}</td>
          <td class="px-4 py-3 text-slate-400">${job.location}</td>
          <td class="px-4 py-3 text-slate-500">${job.posted_date ? String(job.posted_date).split('T')[0] : 'N/A'}</td>
          <td class="px-6 py-3 text-right">
            <a href="${job.apply_url}" target="_blank" class="text-brand-500 hover:text-brand-400 font-semibold">Apply <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i></a>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    initFeed();
  </script>
</body>
</html>
