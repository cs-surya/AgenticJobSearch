name: Offline ATS Aggregator Sync

on:
  schedule:
    # Runs once daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual run anytime

jobs:
  scrape-and-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install "httpx[http2]" aiofiles pydantic beautifulsoup4

      - name: Run High-Speed Offline Scraper
        run: |
          python cron_scraper.py

      - name: Commit & Push Updated Gzip Chunks
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cache/
          if git diff --staged --quiet; then
            echo "No new updates in data/cache/"
          else
            git commit -m "chore(cache): automated ATS sync update [skip ci]"
            git push
          fi